{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "annotations": {
      "deployment.kubernetes.io/revision": "1"
    },
    "name": "wg-easy",
    "namespace": "wireguard"
  },
  "spec": {
    "progressDeadlineSeconds": 600,
    "replicas": 1,
    "revisionHistoryLimit": 10,
    "selector": {
      "matchLabels": {
        "app.kubernetes.io/name": "wg-easy"
      }
    },
    "strategy": {
      "type": "Recreate"
    },
    "template": {
      "metadata": {
        "labels": {
          "app.kubernetes.io/name": "wg-easy"
        }
      },
      "spec": {
        "automountServiceAccountToken": false,
        "containers": [
          {
            "args": [
              "/usr/bin/dumb-init",
              "node",
              "server.js"
            ],
            "command": [
              "docker-entrypoint.sh"
            ],
            "envFrom": [
              {
                "secretRef": {
                  "name": "wg-easy-env"
                }
              }
            ],
            "image": "ghcr.io/wg-easy/wg-easy@sha256:66352ccb4b5095992550aa567df5118a5152b6ed31be34b0a8e118a3c3a35bf5",
            "imagePullPolicy": "IfNotPresent",
            "name": "wg-easy",
            "ports": [
              {
                "containerPort": 51820,
                "name": "p51820-udp",
                "protocol": "UDP"
              },
              {
                "containerPort": 51821,
                "name": "p51821-tcp",
                "protocol": "TCP"
              }
            ],
            "readinessProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "/usr/bin/timeout 5s /bin/sh -c \"/usr/bin/wg show | /bin/grep -q interface || exit 1\" --interval=1m --timeout=5s --retries=3"
                ]
              },
              "failureThreshold": 3,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 5
            },
            "resources": {
              "requests": {
                "cpu": "25m",
                "memory": "64Mi"
              }
            },
            "securityContext": {
              "capabilities": {
                "add": [
                  "NET_ADMIN",
                  "SYS_MODULE"
                ]
              }
            },
            "startupProbe": {
              "exec": {
                "command": [
                  "/bin/sh",
                  "-c",
                  "/usr/bin/timeout 5s /bin/sh -c \"/usr/bin/wg show | /bin/grep -q interface || exit 1\" --interval=1m --timeout=5s --retries=3"
                ]
              },
              "failureThreshold": 180,
              "periodSeconds": 10,
              "successThreshold": 1,
              "timeoutSeconds": 5
            },
            "terminationMessagePath": "/dev/termination-log",
            "terminationMessagePolicy": "File",
            "volumeMounts": [
              {
                "mountPath": "/etc/wireguard",
                "name": "v-a733a898e0343b77"
              },
              {
                "mountPath": "/dev/shm",
                "name": "shm"
              }
            ],
            "workingDir": "/app"
          }
        ],
        "dnsPolicy": "ClusterFirstWithHostNet",
        "hostNetwork": true,
        "imagePullSecrets": [
          {
            "name": "registry-credentials"
          }
        ],
        "nodeSelector": {
          "kubernetes.io/hostname": "spainip-k3s"
        },
        "restartPolicy": "Always",
        "schedulerName": "default-scheduler",
        "securityContext": {},
        "terminationGracePeriodSeconds": 120,
        "volumes": [
          {
            "name": "v-a733a898e0343b77",
            "persistentVolumeClaim": {
              "claimName": "v-a733a898e0343b77"
            }
          },
          {
            "emptyDir": {
              "medium": "Memory",
              "sizeLimit": "67108864"
            },
            "name": "shm"
          }
        ]
      }
    }
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "labels": {
      "kustomize.toolkit.fluxcd.io/name": "wireguard-wg-easy",
      "kustomize.toolkit.fluxcd.io/namespace": "flux-system"
    },
    "name": "wg-easy",
    "namespace": "wireguard"
  },
  "spec": {
    "clusterIP": "10.43.114.130",
    "clusterIPs": [
      "10.43.114.130"
    ],
    "internalTrafficPolicy": "Cluster",
    "ipFamilies": [
      "IPv4"
    ],
    "ipFamilyPolicy": "SingleStack",
    "ports": [
      {
        "name": "p51820-udp",
        "port": 51820,
        "protocol": "UDP",
        "targetPort": 51820
      },
      {
        "name": "p51821-tcp",
        "port": 51821,
        "protocol": "TCP",
        "targetPort": 51821
      }
    ],
    "selector": {
      "app.kubernetes.io/name": "wg-easy"
    },
    "sessionAffinity": "None",
    "type": "ClusterIP"
  }
}
---
{
  "apiVersion": "traefik.io/v1alpha1",
  "kind": "IngressRoute",
  "metadata": {
    "labels": {
      "kustomize.toolkit.fluxcd.io/name": "wireguard-wg-easy",
      "kustomize.toolkit.fluxcd.io/namespace": "flux-system"
    },
    "name": "wg-easy-wireguard",
    "namespace": "wireguard"
  },
  "spec": {
    "entryPoints": [
      "websecure"
    ],
    "routes": [
      {
        "kind": "Rule",
        "match": "Host(`wireguard.spainip.es`)",
        "services": [
          {
            "name": "wg-easy",
            "port": 51821
          }
        ]
      }
    ],
    "tls": {
      "certResolver": "acmeresolver"
    }
  }
}
---
